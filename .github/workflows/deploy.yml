name: Build and Deploy Rust System

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Use a standard, reliable GitHub-hosted runner (cloud)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }} # Optional if using OAuth
          authkey: ${{ secrets.TS_AUTHKEY }} # Use the auth key you created
          tags: tag:ci # Optional: tag for the ephemeral runner node

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Static Binary
        working-directory: ./system
        run: cargo build --release --target x86_64-unknown-linux-musl

      # Now, use the Tailscale IP to reach your private VM
      - name: Copy Binary and Templates to Alpine VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TAILSCALE_VM_IP }} # Use the Tailscale IP
          username: ${{ secrets.ALPINE_USER }}
          key: ${{ secrets.ALPINE_SSH_KEY }}
          source: "system/target/x86_64-unknown-linux-musl/release/regime_flyers,system/templates/*"
          target: "/home/regimeflyers/deploy/"
          strip_components: 5

      - name: Restart OpenRC Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TAILSCALE_VM_IP }} # Use the Tailscale IP
          username: ${{ secrets.ALPINE_USER }}
          key: ${{ secrets.ALPINE_SSH_KEY }}
          script: |
            sudo chmod +x /home/regimeflyers/deploy/regime_flyers
            sudo cp /home/regimeflyers/deploy/regime_flyers /usr/local/bin/regime_flyers
            sudo cp -r /home/regimeflyers/deploy/templates /usr/local/bin/templates
            sudo rc-service regime-flyers restart
