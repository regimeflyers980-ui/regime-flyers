name: Build and Deploy Rust System

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Check VM Connectivity
        run: |
          echo "Pinging VM..."
          ping -c 4 ${{ secrets.TAILSCALE_VM_IP }} || exit 1
          echo "Checking SSH Port..."
          nc -zv -w 5 ${{ secrets.TAILSCALE_VM_IP }} 22 || exit 1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Static Binary
        working-directory: ./system
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Copy Binary and Templates to Alpine VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TAILSCALE_VM_IP }}
          username: ${{ secrets.ALPINE_USER }}
          key: ${{ secrets.ALPINE_SSH_KEY }}
          source: "system/target/x86_64-unknown-linux-musl/release/regime_flyers,system/templates/*"
          target: "/home/regimeflyers/deploy/"

      - name: Restart OpenRC Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TAILSCALE_VM_IP }}
          username: ${{ secrets.ALPINE_USER }}
          key: ${{ secrets.ALPINE_SSH_KEY }}
          script: |
            sudo chmod +x /home/regimeflyers/deploy/system/target/x86_64-unknown-linux-musl/release/regime_flyers
            sudo cp /home/regimeflyers/deploy/system/target/x86_64-unknown-linux-musl/release/regime_flyers /usr/local/bin/regime_flyers
            
            sudo mkdir -p /usr/local/bin/templates
            sudo cp -r /home/regimeflyers/deploy/system/templates/* /usr/local/bin/templates/
            
            sudo rc-service regime-flyers restart
