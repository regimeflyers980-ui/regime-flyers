name: Build and Deploy Rust System

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools and rsync
        run: sudo apt-get update && sudo apt-get install -y musl-tools rsync

      - name: Build Static Binary
        working-directory: ./system
        run: cargo build --release --target x86_64-unknown-linux-musl

      # NATIVE DEPLOYMENT (NO BUGGY EXTERNAL ACTIONS)
      - name: Deploy via Native SSH & Rsync
        run: |
          # 1. Setup SSH Key securely
          mkdir -p ~/.ssh
          echo "${{ secrets.ALPINE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 2. Clean the IP secret of any hidden newlines
          IP=$(echo "${{ secrets.TAILSCALE_VM_IP }}" | tr -d '[:space:]')

          # 3. Add VM to known_hosts to prevent handshake prompts (Fixes the EOF error)
          ssh-keyscan -H $IP >> ~/.ssh/known_hosts 2>/dev/null

          # 4. Use Rsync to copy files (Fails fast if network drops)
          timeout 60 rsync -avz -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10" \
            ./system/target/x86_64-unknown-linux-musl/release/regime_flyers \
            ./system/templates \
            ${{ secrets.ALPINE_USER }}@$IP:/home/regimeflyers/deploy/

      - name: Restart OpenRC Service
        run: |
          IP=$(echo "${{ secrets.TAILSCALE_VM_IP }}" | tr -d '[:space:]')
          timeout 60 ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.ALPINE_USER }}@$IP << 'EOF'
            sudo chmod +x /home/regimeflyers/deploy/regime_flyers
            sudo cp /home/regimeflyers/deploy/regime_flyers /usr/local/bin/regime_flyers
            sudo mkdir -p /usr/local/bin/templates
            sudo cp -r /home/regimeflyers/deploy/templates/* /usr/local/bin/templates/
            sudo rc-service regime-flyers restart
          EOF
